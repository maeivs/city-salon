<h2 style="margin: 0 0 8px; font-size: 22px; font-weight: 700; color: #1a1a2e;">계정이 휴면 처리되었습니다</h2>
<p style="margin: 0 0 24px; font-size: 13px; color: #999;">${email}</p>
<p style="margin: 0 0 20px; font-size: 15px; color: #555; line-height: 1.6;">
    안녕하세요.<br>
    장기간 로그인 기록이 없어 <strong>${email}</strong> 계정이 <strong>휴면 상태</strong>로 전환되었습니다.
</p>
<div style="background-color: #f0f4ff; border-left: 4px solid #4f6ef7; border-radius: 4px; padding: 16px 20px; margin: 0 0 24px;">
    <p style="margin: 0; font-size: 14px; color: #2d3a8c; line-height: 1.6;">
        휴면 계정은 로그인 시 본인 확인 후 즉시 복구할 수 있습니다.<br>
        개인정보 보호를 위해 일정 기간이 지나면 계정 정보가 삭제될 수 있습니다.
    </p>
</div>
<p style="margin: 0 0 24px; font-size: 15px; color: #555; line-height: 1.6;">
    계속 서비스를 이용하시려면 아래 버튼을 클릭해 로그인해 주세요.
</p>
<div style="text-align: center; margin: 0 0 28px;">
    <a href="${login_url|#}" style="display: inline-block; padding: 14px 40px; background-color: #1a1a2e; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 15px; font-weight: 600;">로그인하여 계정 복구</a>
</div>
<p style="margin: 0; font-size: 13px; color: #aaa; line-height: 1.6;">
    본인이 요청하지 않은 이메일이라면 무시하셔도 됩니다. 이 안내는 자동 발송된 이메일입니다.
</p>
