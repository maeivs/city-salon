<h2 style="margin: 0 0 16px; font-size: 22px; font-weight: 700; color: #1a1a2e;">가입을 환영합니다!</h2>
<p style="margin: 0 0 24px; font-size: 15px; color: #555; line-height: 1.6;">
    <strong>${name|회원}</strong>님, 가입해 주셔서 감사합니다.<br>
    아래 계정으로 서비스를 이용하실 수 있습니다.
</p>
<div style="padding: 16px 20px; background-color: #f4f4f7; border-radius: 8px; border: 1px solid #e0e0e0; margin: 0 0 24px;">
    <p style="margin: 0; font-size: 14px; color: #555;">
        <span style="color: #888;">이메일</span><br>
        <strong style="font-size: 15px; color: #1a1a2e;">${email}</strong>
    </p>
</div>
<p style="margin: 0; font-size: 13px; color: #aaa; line-height: 1.6;">
    본인이 가입하지 않은 경우 이 이메일을 무시하거나 고객센터에 문의하세요.
</p>
